<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard BEES Vision - Auditoria Galaxia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { margin: 0; background: #eef4f8; color: #172033; font-family: Inter, ui-sans-serif, system-ui, Segoe UI, sans-serif; }
      .glass { border: 1px solid rgba(148,163,184,.25); background: rgba(255,255,255,.9); box-shadow: 0 18px 60px rgba(15,23,42,.11); backdrop-filter: blur(18px); }
      .thin::-webkit-scrollbar { height: 8px; width: 8px; } .thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;
      const R = Recharts;
      const target = .7;
      const files = {
        main: "data - 2026-05-11T104007.975.xlsx",
        clients: "20260511104225plantillaClientesAR.xlsx",
        review: "DEL VALLE 2026 DISTRIS - Ticket invalidas a validas final (1).xlsx",
        anomalies: "Anomaly cierre Abril.xlsx"
      };
      const nk = (v="") => String(v ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"");
      const nt = (v="") => String(v ?? "").trim().replace(/\s+/g," ");
      const num = v => { const n = Number(String(v ?? 0).replace(",",".").replace(/[^\d.-]/g,"")); return Number.isFinite(n) ? n : 0; };
      const pct = (a,b) => b ? a / b : 0;
      const fp = v => `${((Number.isFinite(v)?v:0)*100).toFixed(1)}%`;
      const col = i => { let s="", n=i+1; while(n>0){ let m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-m)/26); } return s; };
      function field(row, names, fallback) {
        const keys = Object.keys(row), map = Object.fromEntries(keys.map(k => [nk(k), k]));
        for (const name of names) if (map[nk(name)] && row[map[nk(name)]] !== "") return row[map[nk(name)]];
        for (const name of names) { const k = nk(name); const hit = Object.keys(map).find(x => x.includes(k) || k.includes(x)); if (hit && row[map[hit]] !== "") return row[map[hit]]; }
        return fallback ? row[`__${fallback}`] : "";
      }
      function dateKey(v){ if(!v) return ""; const d = v instanceof Date ? v : new Date(v); if(!Number.isNaN(d.getTime())) return d.toISOString().slice(0,10); const m=String(v).match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})/); if(!m)return ""; return `${m[3].length===2?"20"+m[3]:m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
      function monthKey(v,s=""){ const d=dateKey(v); if(d) return d.slice(0,7); const m=nk(s).match(/(\d{1,2})/); return m ? `2026-${m[1].padStart(2,"0")}` : ""; }
      function img(v){ const t=nt(v).toLowerCase().split("?")[0].replace(/^https?:\/\//,"").replace(/\/$/,""); return t ? [t, t.split(/[\\/]/).pop()].filter(Boolean) : []; }
      async function read(pathOrFile) {
        const buf = typeof pathOrFile === "string" ? await fetch(pathOrFile).then(r => r.arrayBuffer()) : await pathOrFile.arrayBuffer();
        const wb = XLSX.read(buf, { type:"array", cellDates:true });
        const rows = [];
        wb.SheetNames.forEach(sn => {
          const m = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, raw:false, defval:"" });
          if(!m.length) return; const hi = Math.max(0, m.findIndex(r => r.filter(c => nt(c)).length >= 3)); const h = m[hi] || [];
          m.slice(hi+1).forEach((r,ri) => { const o={__sheet:sn,__row:ri+hi+2}; r.forEach((c,i)=>{ o[`__${col(i)}`]=c; if(nt(h[i])) o[nt(h[i])]=c; }); rows.push(o); });
        });
        return rows;
      }
      function process(ds) {
        const clientMap = new Map();
        ds.clients.forEach(r => { const code=nt(field(r,["codigo cliente","cod cliente","poc id","cliente"],"I")); if(code) clientMap.set(code,{name:nt(field(r,["nombre fantasia","fantasia","razon social","cliente","nombre"],"")),seller:nt(field(r,["vendedor"],"")),supervisor:nt(field(r,["supervisor"],"")),zone:nt(field(r,["zona"],""))}); });
        const anomalyByImg = new Map();
        const anomalies = ds.anomalies.map(r => { const image=field(r,["link imagen","imagen","image url","image","foto","url","photo"],""); const raw=field(r,["tipo anomaly","tipo anomalia","anomaly type","motivo","reason"],""); const k=nk(raw); const type=k.includes("fraude")?"Fraude":k.includes("foco")?"Fuera de foco":k.includes("pop")?"POP invalido":nt(raw)||"Otras"; const a={type,image,promoter:nt(field(r,["promotor"],"")),task:nt(field(r,["tarea","detalle tarea"],"")),pillar:nt(field(r,["pilar","pilar de la liga"],"")),dateKey:dateKey(field(r,["fecha","fecha ejecucion"],""))}; img(image).forEach(x=>anomalyByImg.set(x,a)); return a; });
        const match = image => img(image).map(x=>anomalyByImg.get(x)).find(Boolean);
        const pillar = v => { const k=nk(v); if(k.includes("frio")) return "Frio"; if(k.includes("precio")) return "Precio"; if(k.includes("dispon")) return "Disponibilidad"; return nt(v)||"Sin pilar"; };
        const tasks = ds.main.map(r => { const clientCode=nt(field(r,["codigo cliente","cod cliente","poc id"],"I")); const c=clientMap.get(clientCode)||{}; const image=field(r,["link imagen","imagen","image url","image","foto","url","photo"],""); const an=match(image); const dv=field(r,["fecha","fecha ejecucion","fecha visita","date"],""); const valid=num(field(r,["validacion","valida","valid","resultado"],"P"))>=1?1:0; return {clientCode,clientName:c.name||nt(field(r,["cliente","nombre fantasia"],"")),supervisor:c.supervisor||nt(field(r,["supervisor"],"")),task:nt(field(r,["nombre tarea","tarea","detalle tarea","task"],"N"))||"Sin tarea",pillar:pillar(field(r,["Pilar de la Liga","pilar"],"")),valid,invalid:valid?0:1,promoter:nt(field(r,["promotor"],""))||"Sin promotor",dateKey:dateKey(dv),monthKey:monthKey(dv,r.__sheet),image,anomaly:!!an,anomalyType:an?.type||"Sin anomaly"}; }).filter(r=>r.clientCode||r.task!=="Sin tarea");
        const reviews = ds.review.map(r => { const comment=nt(field(r,["Comentario","comment"],"")); const ck=nk(comment); const image=field(r,["IMAGEN","Foto","link imagen","imagen","image url","foto"],""); const an=match(image); let reviewed="No", result="Pendiente revision"; if(ck){ reviewed="Si"; result=ck.includes("valida")&&ck.includes("falla")&&ck.includes("algoritmo")?"Valida por falla algoritmo":ck.includes("invalida")?"Invalida confirmada":comment; } const dv=field(r,["FECHA EJECUCION","fecha ejecucion","fecha"],""); return {dateKey:dateKey(dv),monthKey:monthKey(dv,r.__sheet),promoter:nt(field(r,["PROMOTOR","promotor"],""))||"Sin promotor",client:nt(field(r,["Cliente","POC ID","poc id"],"")),pocId:nt(field(r,["POC ID","poc id"],"")),task:nt(field(r,["DETALLE TAREA","detalle tarea","tarea"],""))||"Sin tarea",image,comment,reviewed,result,anomaly:!!an,anomalyType:an?.type||"Sin anomaly"}; }).filter(r=>r.task!=="Sin tarea"||r.comment||r.image);
        return {tasks,reviews,anomalies};
      }
      const group=(rows,fn)=>rows.reduce((m,r)=>{const k=fn(r)||"Sin dato";(m[k] ||= []).push(r);return m;},{});
      const mode=a=>Object.entries(group(a.filter(Boolean),x=>x)).sort((a,b)=>b[1].length-a[1].length)[0]?.[0]||"Sin dato";
      function metrics(tasks,reviews,anomalies){ const total=tasks.length, valid=tasks.reduce((s,r)=>s+r.valid,0), invalid=total-valid, matched=[...tasks.filter(r=>r.anomaly),...reviews.filter(r=>r.anomaly)], au=anomalies.length?anomalies:matched;
        const byPillar=Object.entries(group(tasks,r=>r.pillar)).map(([pillar,rows])=>{const v=rows.reduce((s,r)=>s+r.valid,0);return{pillar,total:rows.length,valid:v,invalid:rows.length-v,validation:pct(v,rows.length),anomalies:rows.filter(r=>r.anomaly).length,gap:pct(v,rows.length)-target};});
        const topInv=Object.entries(group(tasks.filter(r=>r.invalid),r=>r.task)).map(([task,rows])=>({task,pillar:mode(rows.map(r=>r.pillar)),count:rows.length,rate:pct(rows.length,tasks.filter(r=>r.task===task).length),anomalies:rows.filter(r=>r.anomaly).length})).sort((a,b)=>b.count-a.count).slice(0,5);
        const topVal=Object.entries(group(tasks.filter(r=>r.valid),r=>r.task)).map(([task,rows])=>({task,pillar:mode(rows.map(r=>r.pillar)),count:rows.length,rate:pct(rows.length,tasks.filter(r=>r.task===task).length)})).sort((a,b)=>b.count-a.count).slice(0,5);
        const clients=Object.entries(group(tasks,r=>r.clientCode||r.clientName)).map(([client,rows])=>{const v=rows.reduce((s,r)=>s+r.valid,0), inv=rows.filter(r=>r.invalid);return{client,name:mode(rows.map(r=>r.clientName))||client,total:rows.length,valid:v,invalid:rows.length-v,anomalies:rows.filter(r=>r.anomaly).length,validation:pct(v,rows.length),criticalPillar:mode(inv.map(r=>r.pillar)),criticalTask:mode(inv.map(r=>r.task))};}).sort((a,b)=>a.validation-b.validation||b.total-a.total).slice(0,25);
        const promoters=Object.entries(group(tasks,r=>r.promoter)).map(([promoter,rows])=>{const v=rows.reduce((s,r)=>s+r.valid,0);return{promoter,total:rows.length,valid:v,invalid:rows.length-v,anomalies:rows.filter(r=>r.anomaly).length,validation:pct(v,rows.length)}}).sort((a,b)=>b.validation-a.validation||b.total-a.total);
        const trend=Object.entries(group([...tasks.map(r=>({...r,src:"task"})),...reviews.map(r=>({...r,src:"review"}))],r=>r.dateKey||r.monthKey)).map(([date,rows])=>{const tr=rows.filter(r=>r.src==="task"), v=tr.reduce((s,r)=>s+r.valid,0);return{date,validation:pct(v,tr.length),anomalies:rows.filter(r=>r.anomaly).length,reviews:rows.filter(r=>r.src==="review").length,objective:target}}).filter(r=>r.date).sort((a,b)=>a.date.localeCompare(b.date));
        const reviewed=reviews.filter(r=>r.reviewed==="Si").length, algorithm=reviews.filter(r=>r.result==="Valida por falla algoritmo").length;
        const byType=Object.entries(group(au,r=>r.anomalyType||r.type||"Otras")).map(([type,rows])=>({type,count:rows.length})).sort((a,b)=>b.count-a.count);
        const anProm=Object.entries(group(matched,r=>r.promoter)).map(([promoter,rows])=>({promoter,count:rows.length})).sort((a,b)=>b.count-a.count).slice(0,10);
        const heat=Object.entries(group(matched,r=>`${r.promoter||"Sin promotor"}|${r.task||"Sin tarea"}|${r.pillar||"Sin pilar"}`)).map(([k,rows])=>{const [promoter,task,pillar]=k.split("|"); return{promoter,task,pillar,count:rows.length}}).sort((a,b)=>b.count-a.count).slice(0,20);
        const anTrend=Object.entries(group(matched.length?matched:au,r=>r.dateKey||r.monthKey)).map(([date,rows])=>({date,anomalies:rows.length})).filter(r=>r.date).sort((a,b)=>a.date.localeCompare(b.date));
        return{executive:{validation:pct(valid,total),gap:pct(valid,total)-target,total,valid,invalid,anomalies:au.length,anomalyRate:pct(tasks.filter(r=>r.anomaly).length,total),reviewed,algorithmFixes:algorithm},byPillar,topInv,topVal,clients,promoters,trend,review:{total:reviews.length,reviewed,pending:reviews.length-reviewed,algorithmFixes:algorithm,invalidConfirmed:reviews.filter(r=>r.result==="Invalida confirmada").length,reviewedRate:pct(reviewed,reviews.length),correctionRate:pct(algorithm,reviewed),anomalyReviewed:reviews.filter(r=>r.reviewed==="Si"&&r.anomaly).length},anomaly:{total:au.length,fraud:byType.find(x=>nk(x.type).includes("fraude"))?.count||0,blur:byType.find(x=>nk(x.type).includes("fueradefoco"))?.count||0,pop:byType.find(x=>nk(x.type).includes("pop"))?.count||0,byType,promoters:anProm,heat,trend:anTrend}};
      }
      const uniq=(rows,k)=>[...new Set(rows.map(r=>r[k]).filter(Boolean))].sort();
      function apply(rows,f){return rows.filter(r=>(!f.month||r.monthKey===f.month)&&(!f.pillar||r.pillar===f.pillar)&&(!f.promoter||r.promoter===f.promoter)&&(!f.supervisor||r.supervisor===f.supervisor)&&(!f.task||r.task===f.task)&&(!f.reviewed||r.reviewed===f.reviewed)&&(!f.result||r.result===f.result)&&(!f.anomaly||(r.anomaly?"Si":"No")===f.anomaly)&&(!f.type||r.anomalyType===f.type)&&(!f.from||!r.dateKey||r.dateKey>=f.from)&&(!f.to||!r.dateKey||r.dateKey<=f.to));}
      function Card({t,v,s,c="slate"}){return <div className="glass rounded-lg p-4"><p className="text-xs font-bold uppercase text-slate-500">{t}</p><p className={`mt-2 text-2xl font-black ${c==="red"?"text-rose-700":c==="green"?"text-emerald-700":"text-slate-950"}`}>{v}</p><p className="mt-2 text-xs text-slate-500">{s}</p></div>}
      function App(){ const [raw,setRaw]=useState({main:[],clients:[],review:[],anomalies:[]}),[loaded,setLoaded]=useState("Cargando Excels..."),[f,setF]=useState({}); useEffect(()=>{Promise.all(Object.entries(files).map(([k,n])=>read(`/data/${encodeURIComponent(n)}`).then(rows=>[k,rows]))).then(items=>{setRaw(Object.fromEntries(items));setLoaded("Excels cargados desde public/data");}).catch(e=>setLoaded("No se pudieron cargar automatico. Usa los botones de carga."));},[]);
        const p=useMemo(()=>process(raw),[raw]), ft=useMemo(()=>apply(p.tasks,f),[p.tasks,f]), fr=useMemo(()=>apply(p.reviews,f),[p.reviews,f]), m=useMemo(()=>metrics(ft,fr,p.anomalies),[ft,fr,p.anomalies]);
        const opts=useMemo(()=>({months:uniq([...p.tasks,...p.reviews],"monthKey"),pillars:uniq(p.tasks,"pillar"),promoters:uniq([...p.tasks,...p.reviews],"promoter"),supervisors:uniq(p.tasks,"supervisor"),tasks:uniq([...p.tasks,...p.reviews],"task"),results:uniq(p.reviews,"result"),types:uniq([...p.tasks,...p.reviews],"anomalyType")}),[p]);
        const setFile=async(k,file)=>{if(!file)return; const rows=await read(file); setRaw(x=>({...x,[k]:rows}));};
        const sem=m.executive.validation>=.7?"green":m.executive.validation>=.6?"amber":"red";
        return <main className="min-h-screen px-4 py-6 lg:px-8 bg-[radial-gradient(circle_at_top_left,#dbeafe,transparent_32%),linear-gradient(180deg,#f8fafc,#e8eef5)]"><div className="mx-auto max-w-[1500px] space-y-6">
          <header className="rounded-lg bg-slate-950 p-7 text-white shadow-2xl"><p className="mb-3 inline-flex rounded-full bg-white/10 px-3 py-1 text-xs font-bold uppercase">Auditoria Galaxia · BEES Vision</p><h1 className="text-3xl lg:text-5xl font-black">Dashboard BEES Vision — Auditoría Galaxia</h1><p className="mt-3 text-slate-300">Puntos 3 y 4 — Validación, Oportunidades y Revisión de Anomalías</p><div className="mt-5 inline-flex items-center gap-3 rounded-lg border border-white/10 bg-white/10 px-4 py-3"><span className={`h-4 w-4 rounded-full ${sem==="green"?"bg-emerald-400":sem==="amber"?"bg-amber-400":"bg-rose-400"}`}></span><b>{sem==="green"?"En objetivo":sem==="amber"?"Cerca del objetivo":"Bajo objetivo"}</b><span className="text-slate-300">Meta 70%</span></div></header>
          <section className="glass rounded-lg p-5"><div className="grid gap-3 lg:grid-cols-4">{[["main","Archivo principal"],["clients","Maestro clientes"],["review","Revision invalidas"],["anomalies","Anomalies"]].map(([k,l])=><label key={k} className="rounded-lg border border-slate-200 bg-white/70 p-3 font-bold">{l}<input className="mt-3 block w-full text-xs" type="file" accept=".xlsx,.xls" onChange={e=>setFile(k,e.target.files[0])}/></label>)}</div><p className="mt-3 text-sm text-slate-500">{loaded}</p></section>
          <section className="glass rounded-lg p-5"><div className="grid gap-3 md:grid-cols-3 xl:grid-cols-6">{[["from","Desde","date"],["to","Hasta","date"]].map(([k,l,t])=><label key={k} className="text-sm font-bold text-slate-600">{l}<input type={t} className="mt-1 w-full rounded border p-2" onChange={e=>setF(x=>({...x,[k]:e.target.value}))}/></label>)}{[["month","Mes",opts.months],["pillar","Pilar",opts.pillars],["promoter","Promotor",opts.promoters],["supervisor","Supervisor",opts.supervisors],["task","Tarea",opts.tasks],["reviewed","Revisada",["Si","No"]],["result","Resultado",opts.results],["anomaly","Anomaly",["Si","No"]],["type","Tipo anomaly",opts.types]].map(([k,l,o])=><label key={k} className="text-sm font-bold text-slate-600">{l}<select className="mt-1 w-full rounded border p-2" onChange={e=>setF(x=>({...x,[k]:e.target.value}))}><option value="">Todos</option>{o.map(v=><option key={v}>{v}</option>)}</select></label>)}</div></section>
          <section className="grid gap-4 sm:grid-cols-2 xl:grid-cols-5"><Card t="% Validacion General" v={fp(m.executive.validation)} s="SUMA columna P / total" c={sem==="red"?"red":"green"}/><Card t="Objetivo" v="70.0%" s="Meta general"/><Card t="Gap vs objetivo" v={`${(m.executive.gap*100).toFixed(1)} pp`} s="Diferencia contra meta" c={m.executive.gap<0?"red":"green"}/><Card t="Total tareas" v={m.executive.total} s="Registros"/><Card t="Tareas validas" v={m.executive.valid} s="P = 1" c="green"/><Card t="Tareas invalidas" v={m.executive.invalid} s="P = 0" c="red"/><Card t="Total anomalies" v={m.executive.anomalies} s="Archivo anomaly"/><Card t="% anomaly" v={fp(m.executive.anomalyRate)} s="Sobre tareas"/><Card t="Tickets revisados" v={m.executive.reviewed} s="Comentario informado"/><Card t="Fallas algoritmo" v={m.executive.algorithmFixes} s="Valida, falla algoritmo" c="green"/></section>
          <h2 className="text-xl font-black">Punto 3 · Oportunidades por pilar</h2><section className="grid gap-4 lg:grid-cols-3">{m.byPillar.map(x=><div className="glass rounded-lg p-5" key={x.pillar}><div className="flex justify-between"><h3 className="text-xl font-black">{x.pillar}</h3><b>{fp(x.validation)}</b></div><div className="mt-4 h-3 rounded-full bg-slate-200"><div className="h-3 rounded-full bg-sky-600" style={{width:`${Math.min(100,x.validation*100)}%`}}></div></div><div className="mt-4 grid grid-cols-4 gap-2 text-center text-sm"><b>{x.valid}<br/><span className="text-xs text-slate-500">Validas</span></b><b>{x.invalid}<br/><span className="text-xs text-slate-500">Invalidas</span></b><b>{x.anomalies}<br/><span className="text-xs text-slate-500">Anom.</span></b><b>{(x.gap*100).toFixed(1)}<br/><span className="text-xs text-slate-500">Gap</span></b></div></div>)}</section>
          <section className="grid gap-5 xl:grid-cols-2"><Chart title="Top 5 tareas invalidas" data={m.topInv} color="#e11d48"/><Chart title="Top 5 tareas validadas" data={m.topVal} color="#059669"/></section>
          <section className="grid gap-5 xl:grid-cols-[1fr_420px]"><Table title="Clientes criticos" rows={m.clients}/><div className="glass rounded-lg p-5"><h2 className="font-black mb-4">Ranking promotores</h2>{m.promoters.slice(0,10).map((r,i)=><div className="mb-3 rounded-lg border p-3" key={r.promoter}><div className="flex justify-between"><b>#{i+1} {r.promoter}</b><b>{fp(r.validation)}</b></div><p className="text-xs text-slate-500">{r.total} tareas · {r.anomalies} anomalies</p></div>)}</div></section>
          <LinePanel title="Evolucion temporal" data={m.trend}/>
          <h2 className="text-xl font-black">Punto 4 · Revisión inválidas a válidas</h2><Review rows={fr} k={m.review}/>
          <h2 className="text-xl font-black">Control y analisis de anomalies</h2><Anomaly data={m.anomaly}/>
        </div></main> }
      function Chart({title,data,color}){return <div className="glass rounded-lg p-5"><h2 className="mb-4 font-black">{title}</h2><div className="h-72"><R.ResponsiveContainer><R.BarChart data={data} layout="vertical"><R.XAxis type="number"/><R.YAxis type="category" dataKey="task" width={150} tick={{fontSize:11}}/><R.Tooltip/><R.Bar dataKey="count" fill={color} radius={[0,8,8,0]}/></R.BarChart></R.ResponsiveContainer></div></div>}
      function Table({title,rows}){return <div className="glass rounded-lg p-5 overflow-auto thin"><h2 className="font-black mb-4">{title}</h2><table className="min-w-[900px] w-full text-sm"><thead><tr className="text-left text-xs uppercase text-slate-500 border-b"><th>Codigo</th><th>Nombre</th><th>Total</th><th>Validas</th><th>Invalidas</th><th>Anom.</th><th>%</th><th>Pilar critico</th><th>Tarea invalida</th></tr></thead><tbody>{rows.map(r=><tr className="border-b" key={r.client}><td className="py-2">{r.client}</td><td>{r.name}</td><td>{r.total}</td><td>{r.valid}</td><td>{r.invalid}</td><td>{r.anomalies}</td><td>{fp(r.validation)}</td><td>{r.criticalPillar}</td><td>{r.criticalTask}</td></tr>)}</tbody></table></div>}
      function LinePanel({title,data}){return <div className="glass rounded-lg p-5"><h2 className="mb-4 font-black">{title}</h2><div className="h-80"><R.ResponsiveContainer><R.ComposedChart data={data}><R.CartesianGrid strokeDasharray="3 3"/><R.XAxis dataKey="date" tick={{fontSize:11}}/><R.YAxis yAxisId="l" tickFormatter={v=>`${Math.round(v*100)}%`}/><R.YAxis yAxisId="r" orientation="right"/><R.Tooltip/><R.Legend/><R.Bar yAxisId="r" dataKey="anomalies" fill="#f97316"/><R.Bar yAxisId="r" dataKey="reviews" fill="#38bdf8"/><R.Line yAxisId="l" dataKey="validation" stroke="#059669" strokeWidth={3}/><R.Line yAxisId="l" dataKey="objective" stroke="#0f172a" strokeDasharray="5 5"/></R.ComposedChart></R.ResponsiveContainer></div></div>}
      function Review({rows,k}){return <div className="glass rounded-lg p-5"><div className="grid gap-3 sm:grid-cols-4 mb-5"><Card t="Total revision" v={k.total}/><Card t="Revisados" v={k.reviewed}/><Card t="Pendientes" v={k.pending}/><Card t="% revisado" v={fp(k.reviewedRate)}/><Card t="Fallas algoritmo" v={k.algorithmFixes}/><Card t="Invalidas confirmadas" v={k.invalidConfirmed}/><Card t="% correccion" v={fp(k.correctionRate)}/><Card t="Anomaly revisadas" v={k.anomalyReviewed}/></div><div className="max-h-[520px] overflow-auto thin"><table className="min-w-[1100px] w-full text-sm"><thead><tr className="text-left text-xs uppercase text-slate-500 border-b"><th>Fecha</th><th>Promotor</th><th>Cliente</th><th>POC ID</th><th>Tarea</th><th>Revisada</th><th>Resultado</th><th>Anomaly</th><th>Tipo</th><th>Comentario</th><th>Foto</th></tr></thead><tbody>{rows.slice(0,300).map((r,i)=><tr className="border-b" key={i}><td className="py-2">{r.dateKey||r.monthKey}</td><td>{r.promoter}</td><td>{r.client}</td><td>{r.pocId}</td><td>{r.task}</td><td>{r.reviewed}</td><td>{r.result}</td><td>{r.anomaly?"Si":"No"}</td><td>{r.anomalyType}</td><td>{r.comment}</td><td>{r.image?<a className="rounded bg-slate-900 text-white px-2 py-1 text-xs" href={r.image} target="_blank">Ver</a>:""}</td></tr>)}</tbody></table></div></div>}
      function Anomaly({data}){return <section className="space-y-5"><div className="grid gap-3 sm:grid-cols-5"><Card t="Total anomaly" v={data.total}/><Card t="Fraude" v={data.fraud}/><Card t="Fuera de foco" v={data.blur}/><Card t="POP invalido" v={data.pop}/><Card t="Otras" v={Math.max(0,data.total-data.fraud-data.blur-data.pop)}/></div><div className="grid gap-5 xl:grid-cols-2"><div className="glass rounded-lg p-5"><h2 className="font-black mb-4">Distribucion por tipo</h2><div className="h-72"><R.ResponsiveContainer><R.PieChart><R.Pie data={data.byType} dataKey="count" nameKey="type" innerRadius={70} outerRadius={110}>{data.byType.map((x,i)=><R.Cell key={x.type} fill={["#ef4444","#f97316","#0ea5e9","#8b5cf6","#64748b"][i%5]}/>)}</R.Pie><R.Tooltip/><R.Legend/></R.PieChart></R.ResponsiveContainer></div></div><div className="glass rounded-lg p-5"><h2 className="font-black mb-4">Promotores con mas anomalies</h2><div className="h-72"><R.ResponsiveContainer><R.BarChart data={data.promoters}><R.XAxis dataKey="promoter" tick={{fontSize:11}}/><R.YAxis/><R.Tooltip/><R.Bar dataKey="count" fill="#ef4444"/></R.BarChart></R.ResponsiveContainer></div></div></div><div className="glass rounded-lg p-5"><h2 className="font-black mb-4">Heatmap operativo</h2>{data.heat.map(r=><div className="mb-2 flex justify-between rounded-lg border p-3" key={`${r.promoter}${r.task}${r.pillar}`}><span><b>{r.promoter}</b><br/><small>{r.task} · {r.pillar}</small></span><b>{r.count}</b></div>)}</div></section>}
      ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
    </script>
  </body>
</html>
