      const renderBase=render;render=function(){renderBase();app.querySelector(".hero")?.insertAdjacentHTML("afterend",`<div data-extra="top">${linksPanel()}<div id="annual-slot" class="card" style="margin-top:16px"><h3>Acumulado anual</h3><p>Cargando acumulado...</p></div></div>`);setTimeout(()=>{try{const p=state.processed||process2(state.raw),slot=document.querySelector("#annual-slot");if(slot)slot.outerHTML=annualPanel(p)}catch(e){const slot=document.querySelector("#annual-slot");if(slot)slot.innerHTML=`<h3>Acumulado anual</h3><p>No se pudo calcular el acumulado: ${esc(e.message)}</p>`}},2000)}
      function sel(id,label,ops){return`<label>${label}<select id="${id}"><option value="">Todos</option>${ops.map(o=>`<option ${state.f[id]===o?"selected":""}>${o}</option>`).join("")}</select></label>`}
      function tableClients(rows){return`<div class="card tablewrap"><h3>Clientes críticos</h3><table><thead><tr><th>Código</th><th>Nombre</th><th>Total</th><th>Válidas</th><th>Inválidas</th><th>Anom.</th><th>%</th><th>Pilar</th><th>Tarea</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.client}</td><td>${r.name}</td><td>${r.total}</td><td>${r.valid}</td><td>${r.invalid}</td><td>${r.anomalies}</td><td>${fmt(r.validation)}</td><td>${r.criticalPillar}</td><td>${r.criticalTask}</td></tr>`).join("")}</tbody></table></div>`}
      function rankProm(rows){return`<div class="card"><h3>Ranking promotores</h3><div class="rank">${rows.map((r,i)=>`<div class="row"><span><b>#${i+1} ${r.promoter}</b><br><small>${r.total} tareas  ·  ${r.anomalies} anomalies</small></span><b>${fmt(r.validation)}</b></div>`).join("")}</div></div>`}
      function review(rows,k){const algTop=Object.entries(group(rows.filter(r=>r.result==="Válida por falla algoritmo"),r=>r.task)).map(([task,rs])=>({task,count:rs.length,promoter:mode(rs.map(r=>r.promoter))})).sort((a,b)=>b.count-a.count).slice(0,5);return`<section class="card"><div class="grid kpis">${card("Total revisión",k.total)}${card("Revisados",k.reviewed)}${card("Pendientes",k.pending)}${card("% revisado",fmt(k.rate))}${card("Fallas algoritmo",k.alg)}${card("Inválidas confirmadas",k.invalid)}${card("% corrección",fmt(k.corr))}${card("Anomalies revisadas",k.anRev)}</div><div class="card" style="margin-top:16px"><h3>Top 5 tareas con fallas de algoritmo</h3><div class="rank">${algTop.map((r,i)=>`<div class="row"><span><b>#${i+1} ${esc(r.task)}</b><br><small>Promotor más frecuente: ${esc(r.promoter||"Sin promotor")}</small></span><b>${r.count}</b></div>`).join("")||"<p>Sin fallas de algoritmo para el filtro actual.</p>"}</div></div><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Promotor</th><th>Cliente</th><th>POC ID</th><th>Tarea</th><th>Revisada</th><th>Resultado</th><th>Anomaly</th><th>Tipo</th><th>Comentario</th><th>Foto</th></tr></thead><tbody>${rows.slice(0,300).map(r=>`<tr><td>${r.dateKey||r.monthKey}</td><td>${r.promoter}</td><td>${r.client}</td><td>${r.pocId}</td><td>${r.task}</td><td>${r.reviewed}</td><td>${r.result}</td><td>${r.anomaly?"Sí":"No"}</td><td>${r.anomalyType}</td><td>${r.comment}</td><td>${r.image?`<a class="btn" href="${r.image}" target="_blank">Ver</a>`:""}</td></tr>`).join("")}</tbody></table></div></section>`}
      function anomaly(a){const colors=["#e11d48","#f59e0b","#0284c7","#7c3aed","#64748b"],imgFor=r=>r.image||(()=>{const hit=state.raw?.main?.find(x=>nt(field(x,["promotor"],""))===r.promoter&&nt(field(x,["detalle tarea","tarea"],"N"))===r.task&&field(x,["link imagen","imagen","image url","image","foto","url","photo"],""));return hit?field(hit,["link imagen","imagen","image url","image","foto","url","photo"],""):""})(),typed=a.heat.map(r=>{const key=`audit-${nk(r.promoter)}-${nk(r.task)}-${nk(r.pillar)}`,e=auditEntry(key);return{...r,key,type:e.type,note:e.note}}),completed=typed.filter(r=>r.type||r.note),byAudit=Object.entries(group(completed,r=>r.type||"Sin clasificar")).map(([type,rows])=>({type,count:rows.reduce((s,r)=>s+r.count,0)})).sort((x,y)=>y.count-x.count),total=byAudit.reduce((s,x)=>s+x.count,0)||0;let acc=0, stops=byAudit.map((x,i)=>{const start=acc/(total||1)*100;acc+=x.count;return`${colors[i%colors.length]} ${start}% ${acc/(total||1)*100}%`}).join(","),isType=t=>byAudit.find(x=>nk(x.type)===nk(t))?.count||0,opt=(val,cur)=>`<option value="${val}" ${cur===val?"selected":""}>${val||"Sin clasificar"}</option>`;return`<section class="grid cols2"><div class="card"><div class="grid kpis">${card("Total anomalies",a.total,"Archivo anomalies")}${card("Fraude",isType("Fraude"))}${card("Fuera de foco",isType("Fuera de foco"))}${card("POP inválido",isType("POP inválido"))}${card("Error algoritmo",isType("Error de algoritmo"))}</div><h3>Distribución por tipo</h3><div class="donut" style="background:conic-gradient(${stops||"#e2e8f0 0 100%"})"></div>${byAudit.map((x,i)=>`<p><b style="color:${colors[i%colors.length]}">●</b> ${x.type}: ${x.count}</p>`).join("")||"<p>Completá el tipo en el heatmap para alimentar este gráfico.</p>"}</div><div class="card"><h3>Heatmap operativo</h3>${typed.map(r=>{const img=imgFor(r);return`<div class="row" style="grid-template-columns:1fr auto"><span><b>${esc(r.promoter)}</b><br><small>${esc(r.task)}  ·  ${esc(r.pillar)}</small><br>${img?`<a class="btn" href="${esc(img)}" target="_blank">Ver foto</a>`:""}<select data-note="${esc(r.key)}" onchange="saveAuditEntry(this.dataset.note,this.value,auditEntry(this.dataset.note).note)">${opt("",r.type)}${opt("Fraude",r.type)}${opt("Fuera de foco",r.type)}${opt("POP inválido",r.type)}${opt("Error de algoritmo",r.type)}${opt("Otra",r.type)}</select><textarea data-note="${esc(r.key)}" placeholder="Comentario: por qué está mal la tarea" oninput="const e=auditEntry(this.dataset.note);localStorage.setItem(this.dataset.note,JSON.stringify({type:e.type,note:this.value}));persistAuditNotes()" onchange="render()">${esc(r.note)}</textarea></span><b>${r.count}</b></div>`}).join("")}</div></section>`}
      function pdaKey(pillar){return "pda-"+nk(state.f.month||"todos")+"-"+nk(pillar)}
      function pdaEntry(pillar){return localStorage.getItem(pdaKey(pillar))||""}
      function savePda(pillar,value){localStorage.setItem(pdaKey(pillar),value)}
      function annualPanel(p){const rows=p.tasks, m=metrics(rows,p.reviews,p.anomalies), months=Object.entries(group(rows,r=>r.monthKey)).sort().map(([month,rs])=>({month,valid:rs.reduce((s,r)=>s+r.valid,0),invalid:rs.reduce((s,r)=>s+r.invalid,0),justified:rs.filter(r=>r.justified).length}));return`<h2>Acumulado anual</h2><section class="grid kpis">${card("% anual",fmt(m.exec.validation),"Todos los meses cargados",m.exec.validation>=target?"green":"red")}${card("Tareas año",m.exec.total,"Acumulado")}${card("Válidas año",m.exec.valid,"Suma columna P","green")}${card("Inválidas año",m.exec.invalid,"P = 0","red")}${card("Anomalies año",m.exec.anomalies,"Acumulado")}</section><section class="grid cols2" style="margin-top:16px">${bars("Validación por mes",months.map(x=>({task:x.month,count:Math.round(pct(x.valid,x.valid+x.invalid)*100)})),"#0284c7")}${groupedBars("Tareas por mes",months)}</section>`}
      const anomalyBase=anomaly;
      anomaly=function(a){const html=anomalyBase(a),typed=a.heat.map(r=>{const key=`audit-${nk(r.promoter)}-${nk(r.task)}-${nk(r.pillar)}`,e=auditEntry(key);return{...r,type:e.type,note:e.note}}),algTop=Object.entries(group(typed.filter(r=>nk(r.type)===nk("Error de algoritmo")),r=>r.task)).map(([task,rows])=>({task,count:rows.reduce((s,r)=>s+r.count,0),promoter:mode(rows.map(r=>r.promoter))})).sort((x,y)=>y.count-x.count).slice(0,5),top=`<div class="card"><h3>Top 5 tareas con error de algoritmo</h3><div class="rank">${algTop.map((r,i)=>`<div class="row"><span><b>#${i+1} ${esc(r.task)}</b><br><small>Promotor mas frecuente: ${esc(r.promoter||"Sin promotor")}</small></span><b>${r.count}</b></div>`).join("")||"<p>Sin tareas marcadas como error de algoritmo para el filtro actual.</p>"}</div></div>`;return html.replace('<div class="card"><h3>Heatmap operativo</h3>',`${top}<div class="card"><h3>Heatmap operativo</h3>`)}
